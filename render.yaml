services:
  - type: web
    name: sms-project
    runtime: python
    buildCommand: "./build_files.sh"
    startCommand: "gunicorn sms_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: sms-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: sms-db
    databaseName: sms_db
    user: sms_user
    plan: free
